version: '2'
services:
  cvs-elasticsearch:
    # Keep this tag in sync with ${elasticsearch-client.version} managed by
    # spring-boot-dependencies (pom.xml parent), which the integration tests use.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    volumes:
      - cvs-es:/usr/share/elasticsearch/data/
    ports:
      - 9203:9200
      - 9303:9300
    environment:
      - 'ES_JAVA_OPTS=-Xms1024m -Xmx1024m'
    # The settings are passed as -E flags, because Elasticsearch 8 ignores environment settings started through this
    # wrapper. Security is disabled, as it was by default in 7.x; Elasticsearch 8 enables it by default.
    command:
      - sh
      - -c
      - './bin/elasticsearch-plugin list | grep -q analysis-icu || ./bin/elasticsearch-plugin install analysis-icu;
        /usr/local/bin/docker-entrypoint.sh elasticsearch -Ediscovery.type=single-node -Expack.security.enabled=false'
